# Builds a signed APK and publishes a GitHub Release when a tag like v1.2.3 is pushed.
# The in-app updater reads the latest release and installs its .apk asset.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
name: Release APK

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle a fresh data snapshot in the APK
        run: python3 scraper/fetch_tft_academy.py app/src/main/assets/tft.json

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing (see README)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PappVersion="$VERSION" -PgithubRepo="$GITHUB_REPOSITORY"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SuperTFT-$GITHUB_REF_NAME.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/SuperTFT-$GITHUB_REF_NAME.apk" | head -3

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Super TFT $GITHUB_REF_NAME" --generate-notes
