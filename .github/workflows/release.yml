# Builds a signed APK and publishes a GitHub Release, either when a tag like v1.2.3 is
# pushed, or from the Actions tab ("Run workflow", enter a version like 1.2.3).
# The in-app updater reads the latest release and installs its .apk asset.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
name: Release APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (creates the tag v1.0.1)"
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        run: |
          V="${TAG#v}"; V="${V#v}"; TAG="v$V"  # accepts 1.0.1 or v1.0.1
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version '$TAG' (expected 1.2.3)"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle a fresh data snapshot in the APK
        run: python3 scraper/fetch_tft_academy.py app/src/main/assets/tft.json

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing (see README)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PappVersion="${TAG#v}" -PgithubRepo="$GITHUB_REPOSITORY"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SuperTFT-$TAG.apk"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "dist/SuperTFT-$TAG.apk" | head -3

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag on this commit when it does not exist yet (manual run).
        run: gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "Super TFT $TAG" --generate-notes
